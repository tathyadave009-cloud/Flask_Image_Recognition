name: CI Workflow

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pylint
        run: python -m pylint app.py model.py --fail-under=8.0

      - name: Run Pytest
        run: |
          python -m pytest -v 2>&1 | tee test_results.txt
          cat test_results.txt >> $GITHUB_STEP_SUMMARY
